<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="بستان المجموعات: لوحة تحفيز للطلاب، لكل مجموعة شجرة عُمانية مثمرة تزداد ثمارها مع كل إجابة صحيحة.">
<meta name="theme-color" content="#FAF4D8">
<title>بستان المجموعات</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌴%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<!-- تعريفات الرسم المشتركة -->
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"></svg>

<!-- ============================== شاشة الدخول ============================ -->
<section id="login" class="screen" aria-labelledby="login-title">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="mark" id="login-mark" aria-hidden="true"></div>
    <h1 id="login-title">بستان المجموعات</h1>
    <p class="sub">لوحة تحفيز الطلاب بأشجار عُمان المثمرة</p>

    <div class="field">
      <label for="in-user">اسم المستخدم</label>
      <input id="in-user" name="user" type="text" autocomplete="username" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="in-pin">رمز الدخول</label>
      <input id="in-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
    </div>

    <p class="login-msg" id="login-msg" role="alert" aria-live="polite"></p>
    <button class="btn btn--primary" id="login-go" type="submit" style="width:100%;justify-content:center">دخول</button>
    <p class="login-hint" id="login-hint"></p>
  </form>
</section>

<!-- ================================ اللوحة =============================== -->
<section id="board" class="screen hidden" aria-labelledby="board-title">
  <div class="topbar">
    <h1 id="board-title"><span aria-hidden="true">🌿</span> <span id="board-heading">بستان المجموعات</span></h1>
    <div class="tools">
      <button class="btn btn--primary" id="btn-celebrate" type="button">إعلان الفائزة</button>
      <button class="btn" id="btn-wheel" type="button">عجلة الحظ</button>
      <button class="btn" id="btn-groups" type="button">مجموعات سريعة</button>
      <button class="btn" id="btn-all" type="button">نقطة للجميع</button>
      <button class="btn btn--ic" id="btn-present" type="button" aria-label="وضع العرض" title="وضع العرض"></button>
      <div class="menu-wrap">
        <button class="btn btn--ic" id="btn-more" type="button" aria-label="المزيد" aria-haspopup="true" aria-expanded="false"></button>
        <div class="menu" id="more-menu" role="menu" hidden>
          <button id="btn-history" type="button" role="menuitem">السجل والتصدير</button>
          <button id="btn-backup" type="button" role="menuitem">نسخة احتياطية</button>
          <button id="btn-settings" type="button" role="menuitem">الإعدادات</button>
          <hr>
          <button id="btn-reset" class="danger" type="button" role="menuitem">إعادة المسابقة</button>
          <button id="btn-logout" type="button" role="menuitem">خروج</button>
        </div>
      </div>
    </div>
  </div>

  <div class="status-row">
    <div class="banner" id="banner" aria-live="polite"></div>
    <div class="timer" id="timer" aria-label="مؤقّت النشاط"></div>
  </div>

  <div class="grid" id="grid"></div>

  <p class="foot-note">اضغطي على الشجرة لإضافة ثمرة · أو استعملي مفاتيح الأرقام من ١ إلى ٦</p>
</section>

<button class="present-exit" id="present-exit" type="button" hidden>وضع العرض</button>
<div id="splash" class="splash" aria-hidden="true"></div>
<div id="modal-root"></div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/trees.js"></script>
<script src="assets/js/planets.js"></script>
<script src="assets/js/shelves.js"></script>
<script src="assets/js/items.js"></script>
<script src="assets/js/sound.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/exporter.js"></script>
<script src="assets/js/timer.js"></script>
<script src="assets/js/wheel.js"></script>
<script src="assets/js/groups.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
