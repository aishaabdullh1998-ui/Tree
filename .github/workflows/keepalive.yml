# يمنع مشروع Supabase المجاني من التوقّف.
#
# الخطّة المجانية توقف المشروع بعد أسبوع بلا أي طلب. وفي الإجازات لا تفتح
# أحدٌ لوحته، فيتوقّف ويظنّ الجميع أن اللوحات تعطّلت. هذا الملف يطرق الباب
# مرّتين في الأسبوع بطلبٍ لا يغيّر شيئًا: يسأل عن حساب غير موجود، فيردّ
# السيرفر «لا حساب» — ويكفي هذا ليُحسب نشاطًا.
#
# يستعمل السرّ BUSTAN_SYNC نفسه، ولا يحتاج إعدادًا إضافيًّا.
name: إبقاء الخادم مستيقظًا

on:
  schedule:
    - cron: '17 6 * * 0,3'      # الأحد والأربعاء، ٦:١٧ صباحًا بتوقيت غرينتش
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: طرق باب الخادم
        env:
          BUSTAN_SYNC: ${{ secrets.BUSTAN_SYNC }}
        run: |
          if [ -z "$BUSTAN_SYNC" ]; then
            echo "لا سرّ BUSTAN_SYNC — لا شيء لأطرقه." >&2
            exit 0
          fi
          URL=$(printf '%s' "$BUSTAN_SYNC" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"].rstrip("/"))')
          KEY=$(printf '%s' "$BUSTAN_SYNC" | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$URL/rest/v1/rpc/board_pull" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_board":"garden","p_user":"__keepalive__","p_pin":"0"}')
          echo "الحالة: $code"
          cat /tmp/out.json; echo
          # نتوقّع 200 مع {"ok":false,"err":"no_account"} — وهذا نجاح
          if [ "$code" != "200" ]; then
            echo "::warning::الخادم لم يردّ كما يجب (الحالة $code). افحصي مشروع Supabase."
            exit 1
          fi
          grep -q 'no_account' /tmp/out.json \
            && echo "الخادم مستيقظ ويعمل ✓" \
            || echo "::warning::ردٌّ غير متوقَّع — افحصي أن ملفّات SQL لُصقت كاملة."
