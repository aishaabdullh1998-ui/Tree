        '<span class="timer-ring-wrap">' + ringSvg('timer-ring', 20, 0.62) + '</span>' +
        '<span class="timer-time" id="t-time">00:00</span>' +
      '</div>' +
      '<div class="t-quick">' +
        '<button type="button" data-sec="30" aria-label="' + L('٣٠ ثانية') + '">' + L('٣٠ث') + '</button>' +
        '<button type="button" data-sec="60" aria-label="' + L('دقيقة واحدة') + '">' + L('١د') + '</button>' +
        '<button type="button" data-sec="180" aria-label="' + L('٣ دقائق') + '">' + L('٣د') + '</button>' +
      '</div>' +
      '<div class="timer-ctrl">' +
        '<button class="tbtn t-toggle" type="button" aria-label="' + L('تشغيل المؤقّت') + '">▶</button>' +
        '<button class="tbtn t-reset" type="button" aria-label="' + L('إعادة ضبط المؤقّت') + '">↺</button>' +
        '<button class="tbtn t-open" type="button" aria-label="' + L('تكبير المؤقّت') + '">⤢</button>' +
      '</div>';

    var self = this;
    this.mount.querySelector('.t-toggle').addEventListener('click', function () { self.toggle(); });
    this.mount.querySelector('.t-reset').addEventListener('click', function () { self.reset(); });
    this.mount.querySelector('.t-open').addEventListener('click', function () { self.openBig(); });
    Array.prototype.forEach.call(this.mount.querySelectorAll('.t-quick button'), function (b) {
      b.addEventListener('click', function () {
        self.setDuration(+b.getAttribute('data-sec'));
        self.markQuick();
      });
    });
    this.markQuick();
  };

  /* إبراز المدّة المختارة */
  Timer.prototype.markQuick = function () {
    var d = this.data();
    Array.prototype.forEach.call(this.mount.querySelectorAll('.t-quick button'), function (b) {
      b.setAttribute('aria-pressed', +b.getAttribute('data-sec') === d.duration ? 'true' : 'false');
    });
  };

  /* -------------------------------- التشغيل ------------------------------- */
  Timer.prototype.isRunning = function () { return this.tickId !== null; };

  Timer.prototype.toggle = function () {
    Sound.unlock();
    if (this.isRunning()) this.pause(); else this.start();
  };

  Timer.prototype.start = function () {
    var d = this.data();
    if (d.remaining <= 0) d.remaining = d.duration;
    this.endAt = Date.now() + d.remaining * 1000;
    this.lastBeep = -1;
    if (this.tickId) clearInterval(this.tickId);
    var self = this;
    this.tickId = setInterval(function () { self.tick(); }, 120);
    this.mount.classList.remove('finished');
    if (this.big) this.big.classList.remove('finished');
    this.refresh();
    Sound.sparkle();
  };

  Timer.prototype.pause = function () {
    if (!this.isRunning()) return;
    var d = this.data();
    d.remaining = Math.max(0, (this.endAt - Date.now()) / 1000);
    clearInterval(this.tickId);
    this.tickId = null;
    this.save();
    this.refresh();
    this.markQuick();
  };

  Timer.prototype.reset = function () {
    var d = this.data();
    if (this.tickId) { clearInterval(this.tickId); this.tickId = null; }
    d.remaining = d.duration;
    this.mount.classList.remove('finished');
    if (this.big) this.big.classList.remove('finished');
    this.save();
    this.refresh();
  };

  Timer.prototype.setDuration = function (sec) {
    var d = this.data();
    d.duration = clamp(sec);
    if (this.tickId) { clearInterval(this.tickId); this.tickId = null; }
    d.remaining = d.duration;
    this.mount.classList.remove('finished');
    if (this.big) this.big.classList.remove('finished');
    this.save();
    this.refresh();
  };

  Timer.prototype.tick = function () {
    var d = this.data();
    var left = (this.endAt - Date.now()) / 1000;

    if (left > 0) {
      var whole = Math.ceil(left);
      if (whole <= 3 && whole !== this.lastBeep) { this.lastBeep = whole; Sound.tickSoft(); }
      d.remaining = left;
      this.refresh();
      return;
    }

    clearInterval(this.tickId);
    this.tickId = null;
    d.remaining = 0;
    this.save();
    this.refresh();
    this.mount.classList.add('finished');
    if (this.big) this.big.classList.add('finished');
    Sound.timeUp();
    this.toast();
  };

  /* -------------------------------- التحديث ------------------------------- */
  Timer.prototype.refresh = function () {
    var d = this.data();
    var frac = d.duration > 0 ? Math.max(0, Math.min(1, d.remaining / d.duration)) : 0;
    var txt = fmt(d.remaining);

    this.paint(this.mount, frac, txt);
    if (this.big) this.paint(this.big, frac, txt);

    var warn = frac <= 0.10 ? 'danger' : (frac <= 0.25 ? 'warn' : '');
    this.mount.classList.remove('warn', 'danger');
    if (warn && d.remaining > 0) this.mount.classList.add(warn);
    if (this.big) {
      this.big.classList.remove('warn', 'danger');
      if (warn && d.remaining > 0) this.big.classList.add(warn);
    }

    var running = this.isRunning();
    var tog = this.mount.querySelector('.t-toggle');
    tog.textContent = running ? '⏸' : '▶';
    tog.setAttribute('aria-label', running ? L('إيقاف المؤقّت مؤقتًا') : L('تشغيل المؤقّت'));
    this.mount.classList.toggle('running', running);
    if (this.big) {
      var bt = this.big.querySelector('.t-toggle');
      if (bt) { bt.textContent = running ? '⏸ ' + L('إيقاف مؤقّت') : '▶ ' + L('ابدأ'); }
      this.big.classList.toggle('running', running);
    }
  };

  Timer.prototype.paint = function (root, frac, txt) {
    var arc = root.querySelector('.tr-arc');
    var head = root.querySelector('.tr-head');
    var time = root.querySelector('.timer-time');
    if (time) time.textContent = txt;
    if (!arc) return;
    var len = parseFloat(arc.getAttribute('stroke-dasharray'));
    arc.setAttribute('stroke-dashoffset', (len * (1 - frac)).toFixed(2));
    if (head) {
      var r = parseFloat(arc.getAttribute('r'));
      var mid = parseFloat(arc.getAttribute('cx'));
      var ang = (-90 + 360 * frac) * Math.PI / 180;
      var sc = head.getAttribute('data-scale') || (root === this.mount ? 0.62 : 1.5);
      head.setAttribute('transform', 'translate(' + (mid + r * Math.cos(ang)).toFixed(2) + ',' +
        (mid + r * Math.sin(ang)).toFixed(2) + ') scale(' + sc + ')');
      head.style.opacity = frac > 0 ? '1' : '0';
    }
  };

  /* ------------------------------ رسالة الانتهاء -------------------------- */
  Timer.prototype.toast = function () {
    var old = document.querySelector('.time-toast');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'time-toast';
    el.setAttribute('role', 'status');
    el.innerHTML = '<span aria-hidden="true">⏳</span> ' + L('انتهى الوقت!');
    document.body.appendChild(el);
    setTimeout(function () { el.classList.add('out'); }, 3400);
    setTimeout(function () { el.remove(); }, 4000);
  };

  /* ------------------------------ المؤقّت الكبير --------------------------- */
  Timer.prototype.openBig = function () {
    var self = this, d = this.data();
    this.closeBig();
    this.beforeOpen();
    var chips = PRESETS.map(function (p) {
      return '<button class="chip' + (p.s === d.duration ? ' on' : '') + '" type="button" data-sec="' + p.s + '">' + p.label + '</button>';
    }).join('');

    var ov = document.createElement('div');
    ov.className = 'overlay timer-overlay';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.setAttribute('aria-label', L('مؤقّت النشاط'));
    ov.innerHTML =
      '<div class="sheet timer-big">' +
        '<h2 style="justify-content:center">⏳ ' + L('مؤقّت النشاط') + '</h2>' +
        '<div class="timer-face big">' +
          '<span class="timer-ring-wrap">' + ringSvg('timer-ring', 84, 1.5, true) + '</span>' +
          '<span class="timer-time">00:00</span>' +
        '</div>' +
        '<div class="chips">' + chips +
          '<label class="chip custom"><input type="number" min="1" max="60" step="1" id="t-custom" placeholder="' + L('؟') + '" aria-label="' + L('دقائق مخصّصة') + '"> ' + L('دقيقة') + '</label>' +
        '</div>' +
        '<div class="sheet-actions" style="justify-content:center">' +
          '<button class="btn btn--primary t-toggle" type="button">▶ ' + L('ابدأ') + '</button>' +
          '<button class="btn t-reset" type="button">↺ ' + L('إعادة') + '</button>' +
          '<button class="btn" data-close type="button">' + L('إغلاق') + '</button>' +
        '</div>' +
      '</div>';

    document.getElementById('modal-root').appendChild(ov);
    this.big = ov;
    if (this.mount.classList.contains('finished')) ov.classList.add('finished');

    ov.addEventListener('mousedown', function (e) { if (e.target === ov) self.closeBig(); });
    ov.querySelector('[data-close]').addEventListener('click', function () { self.closeBig(); });
    ov.querySelector('.t-toggle').addEventListener('click', function () { self.toggle(); });
    ov.querySelector('.t-reset').addEventListener('click', function () { self.reset(); });
    Array.prototype.forEach.call(ov.querySelectorAll('.chip[data-sec]'), function (b) {
      b.addEventListener('click', function () {
        self.setDuration(+b.getAttribute('data-sec'));
        Array.prototype.forEach.call(ov.querySelectorAll('.chip[data-sec]'), function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        var ci = ov.querySelector('#t-custom'); if (ci) ci.value = '';
      });
    });
    var custom = ov.querySelector('#t-custom');
    custom.addEventListener('change', function () {
      var m = parseFloat(custom.value);
      if (!m || m <= 0) return;
      self.setDuration(Math.min(60, m) * 60);
      Array.prototype.forEach.call(ov.querySelectorAll('.chip[data-sec]'), function (x) { x.classList.remove('on'); });
    });

    this.escHandler = function (e) { if (e.key === 'Escape') self.closeBig(); };
    document.addEventListener('keydown', this.escHandler);
    this.refresh();
    ov.querySelector('.t-toggle').focus();
  };

  Timer.prototype.closeBig = function () {
    if (!this.big) return;
    this.big.remove();
    this.big = null;
    if (this.escHandler) document.removeEventListener('keydown', this.escHandler);
    this.refresh();
  };

  global.BustanTimer = { create: function (o) { return new Timer(o); }, PRESETS: PRESETS, fmt: fmt };
})(window);

</script>
<script>
/* ==========================================================================
   عجلة الحظ - اختيار اسم طالب عشوائيًا بطابع البستان
   ========================================================================== */
(function (global) {
  'use strict';
  var Sound = global.Sound;

  /* ألوان القطاعات: سبعة ألوان لا يتجاور منها لونان متشابهان */
  var SEG = [
    { fill: '#657652', text: '#F6F2E6' },   /* PALM     */
    { fill: '#F4D892', text: '#4A4420' },   /* BUTTER   */
    { fill: '#E36559', text: '#FFF2EE' },   /* SANGRIA  */
    { fill: '#94BEBB', text: '#20413F' },   /* LAGOON   */
    { fill: '#E89C73', text: '#4C2B16' },   /* SUNSET   */
    { fill: '#23617E', text: '#E8F1F5' },   /* ODYSSEY  */
    { fill: '#C0B05B', text: '#403A16' },   /* MOSS     */
    { fill: '#F2B6A3', text: '#5A3024' }    /* GUAVA    */
  ];

  var CX = 200, CY = 200, R = 178, LABEL_R = 164, HUB = 46;
  var LABEL_X = CX + LABEL_R;   /* الطرف الخارجي للنص عند الحافة */

  /* دلالة start/end تنقلب بانقلاب اتجاه الصفحة، فيُحسب طرف تثبيت الاسم باللغة */
  function anchorOf(flip) {
    var ltr = (window.L && window.L.lang === 'en');
    if (ltr) return flip ? 'start' : 'end';
    return flip ? 'end' : 'start';
  }
  var TURNS = 6, DUR = 5200;

  function f(n) { return Math.round(n * 100) / 100; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* نقطة على المحيط، الزاوية محسوبة من الأعلى باتجاه عقارب الساعة */
  function pt(deg, r) {
    var a = (deg - 90) * Math.PI / 180;
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r };
  }

  function Wheel(opts) {
    this.get = opts.get;
    this.save = opts.save;
    this.beforeOpen = opts.beforeOpen || function () {};
    this.onClose = opts.onClose || function () {};
    this.openSettings = opts.openSettings || null;
    this.angle = 0;
    this.spinning = false;
    this.ov = null;
    this.raf = null;
  }

  Wheel.prototype.data = function () {
    var d = this.get();
    if (!Array.isArray(d.list)) d.list = [];
    if (!Array.isArray(d.picked)) d.picked = [];
    return d;
  };

  Wheel.prototype.remaining = function () {
    var d = this.data();
    if (!d.skipPicked) return d.list.slice();
    return d.list.filter(function (n) { return d.picked.indexOf(n) === -1; });
  };

  /* ------------------------------- رسم العجلة ----------------------------- */
  Wheel.prototype.wheelSvg = function () {
    var d = this.data(), list = d.list, n = list.length;
    if (!n) {
      return '<div class="wheel-empty">' +
        '<span class="wheel-empty-ico" aria-hidden="true">🎡</span>' +
        '<p>' + L('لا توجد أسماء في العجلة بعد.') + '</p>' +
        '<p class="wheel-empty-hint">' + L('أضيفي أسماء طلابك من صفحة الإعدادات، اسمًا في كل سطر.') + ' ' +
        L('تبقى الأسماء محفوظة في هذا الجهاز وحده.') + '</p>' +
        '<button class="btn btn--primary" id="wheel-add-names" type="button">⚙️ ' + L('أضيفي الأسماء') + '</button>' +
      '</div>';
    }
    var a = 360 / n, i, parts = [], labels = [];
    var fs = n <= 12 ? 18 : (n <= 20 ? 16 : (n <= 34 ? 13 : (n <= 48 ? 11 : 9)));

    for (i = 0; i < n; i++) {
      var s0 = i * a, s1 = (i + 1) * a;
      var p0 = pt(s0, R), p1 = pt(s1, R);
      var big = a > 180 ? 1 : 0;
      var done = d.picked.indexOf(list[i]) !== -1;
      var tone = SEG[i % SEG.length];
      var fill = done ? '#E7DCCB' : tone.fill;
      var col = done ? '#A6AE97' : tone.text;

      parts.push('<path class="seg' + (done ? ' done' : '') + '" data-i="' + i + '" d="M' + f(CX) + ' ' + f(CY) +
        ' L' + f(p0.x) + ' ' + f(p0.y) + ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + f(p1.x) + ' ' + f(p1.y) + ' Z" fill="' + fill + '"/>');

      /* الاسم ممتدًّا من الحافة نحو المركز، مقلوبًا في النصف الأيسر ليبقى مقروءًا */
      var c = s0 + a / 2;
      var rot = ((c - 90) % 360 + 360) % 360;
      var flip = rot > 90 && rot < 270;
      labels.push('<g transform="rotate(' + f(c - 90) + ' ' + CX + ' ' + CY + ')">' +
        '<text class="seg-label" data-i="' + i + '" transform="translate(' + LABEL_X + ' ' + CY + ')' +
        (flip ? ' rotate(180)' : '') + '" text-anchor="' + anchorOf(flip) +
        '" dominant-baseline="middle" font-size="' + fs + '" fill="' + col + '">' +
        (done ? '✓ ' : '') + esc(list[i]) + '</text></g>');
    }

    return '<svg class="wheel-svg" viewBox="0 0 400 400" aria-hidden="true">' +
      '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R + 10) + '" fill="#D8C5AE"/>' +
      '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R + 4) + '" fill="#F3E7DA"/>' +
      '<g class="wheel-rotor">' + parts.join('') + labels.join('') + '</g>' +
      '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="#C3AE94" stroke-width="3"/>' +
      '<circle class="hub" cx="' + CX + '" cy="' + CY + '" r="' + HUB + '" fill="#FCF6EE" stroke="#C3AE94" stroke-width="4"/>' +
      '<text class="hub-text" x="' + CX + '" y="' + CY + '" text-anchor="middle" dominant-baseline="middle" ' +
        'font-size="19" font-weight="800" fill="#657652">' + L('أدِر') + '</text>' +
      '<g class="wheel-pointer">' +
        '<path d="M200 48 l16 -26 h-32 Z" fill="#E36559"/>' +
        '<path d="M200 26 m-18 -4 a18 14 0 1 1 36 0 Z" fill="#C3AE94"/>' +
        '<circle cx="200" cy="18" r="7" fill="#EFCE4B" stroke="#C3AE94" stroke-width="2.5"/>' +
      '</g></svg>';
  };

  /* -------------------------------- النافذة ------------------------------- */
  Wheel.prototype.open = function () {
    var self = this;
    this.close();
    this.beforeOpen();
    var d = this.data();

    var ov = document.createElement('div');
    ov.className = 'overlay wheel-overlay';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.setAttribute('aria-label', L('عجلة الحظ'));
    ov.innerHTML =
      '<div class="sheet wheel-sheet">' +
        '<h2 style="justify-content:center">🎡 ' + L('عجلة الحظ') + '</h2>' +
        '<p class="wheel-result" id="wheel-result" role="status" aria-live="polite">' +
          (d.list.length ? L('اضغطي على العجلة لاختيار اسم') : '') + '</p>' +
        '<div class="wheel-stage">' + this.wheelSvg() + '</div>' +
        '<p class="wheel-count" id="wheel-count"></p>' +
        '<label class="switch wheel-skip"><input type="checkbox" id="wheel-skip"' + (d.skipPicked ? ' checked' : '') +
          '> ' + L('عدم تكرار الاسم المختار') + '</label>' +
        '<div class="sheet-actions" style="justify-content:center">' +
          '<button class="btn btn--primary" id="wheel-spin" type="button">🎡 ' + L('أدِر العجلة') + '</button>' +
          '<button class="btn" id="wheel-reset" type="button">↺ ' + L('إعادة الجميع') + '</button>' +
          '<button class="btn" id="wheel-close" type="button">' + L('إغلاق') + '</button>' +
        '</div>' +
      '</div>';

    document.getElementById('modal-root').appendChild(ov);
    this.ov = ov;

    ov.addEventListener('mousedown', function (e) { if (e.target === ov) self.close(); });
    ov.querySelector('#wheel-close').addEventListener('click', function () { self.close(); });
    ov.querySelector('#wheel-spin').addEventListener('click', function () { self.spin(); });
    ov.querySelector('#wheel-reset').addEventListener('click', function () { self.resetPicked(); });
    this.bindStage();
    ov.querySelector('#wheel-skip').addEventListener('change', function (e) {
      self.data().skipPicked = e.target.checked;
      self.save();
      self.refresh();
    });

    this.escHandler = function (e) { if (e.key === 'Escape') self.close(); };
    document.addEventListener('keydown', this.escHandler);

    this.applyAngle();
    this.refresh();
    ov.querySelector('#wheel-spin').focus();
  };

  Wheel.prototype.close = function () {
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
    this.spinning = false;
    if (this.escHandler) { document.removeEventListener('keydown', this.escHandler); this.escHandler = null; }
    if (this.ov) { this.ov.remove(); this.ov = null; this.onClose(); }
  };

  Wheel.prototype.applyAngle = function () {
    if (!this.ov) return;
    var rotor = this.ov.querySelector('.wheel-rotor');
    if (rotor) rotor.setAttribute('transform', 'rotate(' + f(this.angle) + ' ' + CX + ' ' + CY + ')');
  };

  Wheel.prototype.refresh = function () {
    if (!this.ov) return;
    var d = this.data();
    var left = this.remaining().length;
    var cnt = this.ov.querySelector('#wheel-count');
    if (!d.list.length) {
      cnt.textContent = '';
      var r = this.ov.querySelector('#wheel-result');
      r.textContent = '';
      r.classList.remove('win');
      this.ov.querySelector('#wheel-spin').disabled = true;
      this.ov.querySelector('#wheel-reset').disabled = true;
      return;
    }
    this.ov.querySelector('#wheel-reset').disabled = false;
    if (d.skipPicked) {
      cnt.textContent = left ? L('بقي') + ' ' + left + ' ' + L('من') + ' ' + d.list.length + ' ' + L('اسمًا')
                             : L('اكتملت القائمة — اضغطي «إعادة الجميع» للبدء من جديد');
    } else {
      cnt.textContent = d.list.length + ' ' + L('اسمًا في العجلة');
    }
    this.ov.querySelector('#wheel-spin').disabled = this.spinning || left === 0;
  };

  Wheel.prototype.bindStage = function () {
    var self = this, ov = this.ov;
    if (!ov) return;
    var hub = ov.querySelector('.hub'), hubText = ov.querySelector('.hub-text');
    if (hub) hub.addEventListener('click', function () { self.spin(); });
    if (hubText) hubText.addEventListener('click', function () { self.spin(); });
    var add = ov.querySelector('#wheel-add-names');
    if (add) add.addEventListener('click', function () {
      var open = self.openSettings;
      self.close();
      if (open) open();
    });
  };

  Wheel.prototype.redraw = function () {
    if (!this.ov) return;
    this.ov.querySelector('.wheel-stage').innerHTML = this.wheelSvg();
    this.bindStage();
    this.applyAngle();
    this.refresh();
  };

  Wheel.prototype.resetPicked = function () {
    if (this.spinning || !this.data().list.length) return;
    this.data().picked = [];
    this.save();
    this.redraw();
    this.ov.querySelector('#wheel-result').textContent = L('عادت كل الأسماء إلى العجلة');
    this.ov.querySelector('#wheel-result').classList.remove('win');
    Sound.sparkle();
  };

  /* ------------------------------- الإدارة -------------------------------- */
  Wheel.prototype.spin = function () {
    if (this.spinning || !this.ov) return;
    var d = this.data(), n = d.list.length;
    if (!n) return;

    var pool = [], i;
    for (i = 0; i < n; i++) {
      if (!d.skipPicked || d.picked.indexOf(d.list[i]) === -1) pool.push(i);
    }
    if (!pool.length) {
      this.ov.querySelector('#wheel-result').textContent = L('لم يبقَ اسم — اضغطي «إعادة الجميع»');
      return;
    }

    Sound.unlock();
    this.spinning = true;
    this.refresh();
    var res = this.ov.querySelector('#wheel-result');
    res.textContent = L('تدور') + '…';
    res.classList.remove('win');
    var old = this.ov.querySelector('.seg.win');
    if (old) old.classList.remove('win');

    var target = pool[Math.floor(Math.random() * pool.length)];
    var a = 360 / n;
    var center = target * a + a / 2;
    var jitter = (Math.random() * 0.56 - 0.28) * a;
    var from = this.angle;
    var to = -center + jitter;
    while (to < from + 360 * TURNS) to += 360;

    var self = this, t0 = null, lastSeg = Math.floor(from / a), lastTick = 0;

    function frame(now) {
      if (t0 === null) t0 = now;
      var t = Math.min(1, (now - t0) / DUR);
      var e = 1 - Math.pow(1 - t, 4.2);
      self.angle = from + (to - from) * e;
      self.applyAngle();

      var seg = Math.floor(self.angle / a);
      if (seg !== lastSeg) {
        lastSeg = seg;
        if (now - lastTick > 42) { lastTick = now; Sound.tick(); }
      }

      if (t < 1) { self.raf = requestAnimationFrame(frame); }
      else { self.raf = null; self.land(target); }
    }
    this.raf = requestAnimationFrame(frame);
  };

  Wheel.prototype.land = function (index) {
    var d = this.data();
    var name = d.list[index];
    this.angle = ((this.angle % 360) + 360) % 360;
    this.applyAngle();
    this.spinning = false;

    if (d.picked.indexOf(name) === -1) d.picked.push(name);
    this.save();

    var res = this.ov.querySelector('#wheel-result');
    res.textContent = '🎉 ' + name;
    res.classList.add('win');

    var seg = this.ov.querySelector('.seg[data-i="' + index + '"]');
    if (seg) seg.classList.add('win');
    var lab = this.ov.querySelector('.seg-label[data-i="' + index + '"]');
    if (lab) lab.classList.add('win');

    this.refresh();
    Sound.fanfare();
    if (global.BustanRain) global.BustanRain(28);

    /* تلوين القطاعات المنتهية بعد لحظة، مع إبقاء الفائز بارزًا */
    var self = this;
    setTimeout(function () {
      if (!self.ov || self.spinning) return;
      var s = self.ov.querySelector('.seg[data-i="' + index + '"]');
      if (s) s.classList.remove('win');
      var l = self.ov.querySelector('.seg-label[data-i="' + index + '"]');
      if (l) l.classList.remove('win');
      self.redraw();
      var r = self.ov.querySelector('#wheel-result');
      r.textContent = '🎉 ' + name;
      r.classList.add('win');
    }, 4200);
  };

  global.BustanWheel = { create: function (o) { return new Wheel(o); } };
})(window);

  function esc(s) {

    });
  }

  function groupName(i) { return L('المجموعة') + ' ' + (ORD[i] || (i + 1)); }

  /* خلط فيشر-ييتس */
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {

  /* توزيع متساوٍ: الفائض يُضاف فردًا فردًا بدل ترك مجموعة ناقصة */

          '<p class="wheel-empty-hint">' + L('أضيفي أسماء طلابك من صفحة الإعدادات، اسمًا في كل سطر،') + ' ' +
          L('ثم يوزّعهم الموقع على مجموعات بضغطة واحدة.') + '</p>' +
          '<button class="btn btn--primary" id="qg-add-names" type="button">⚙️ ' + L('أضيفي الأسماء') + '</button>' +

          (n ? '<button class="btn btn--primary" id="qg-go" type="button">🎲 ' + L('وزّعي المجموعات') + '</button>' +

          b.classList.add('on');

      Array.prototype.forEach.call(ov.querySelectorAll('[data-count]'), function (b) {
        b.addEventListener('click', function () {

          Array.prototype.forEach.call(ov.querySelectorAll('[data-count]'), function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          self.save();
          self.hint();
        });

      ov.querySelector('#qg-go').addEventListener('click', function () { self.make(); });
      ov.querySelector('#qg-copy').addEventListener('click', function (e) { self.copy(e.target); });

    var g = groupsCount(n, q.mode, q.mode === 'size' ? q.size : q.count);
    var base = Math.floor(n / g), rem = n % g;
    var txt = n + ' ' + L('طالبًا على') + ' ' + g + (g === 1 ? ' ' + L('مجموعة') : (g === 2 ? ' ' + L('مجموعتين') : ' ' + L('مجموعات'))) + ': ';
    if (rem === 0) txt += L('كل مجموعة') + ' ' + base;
    else txt += rem + ' ' + L('منها') + ' ' + (base + 1) + ' ' + L('والباقي') + ' ' + base;

    var d = this.data(), q = d.quick, n = d.list.length;

  Groups.prototype.paint = function (groups, quiet) {
    if (!this.ov) return;
    var host = this.ov.querySelector('#qg-result');
    host.innerHTML = groups.map(function (members, i) {
      var t = TONE[i % TONE.length];

        ' data-i="' + i + '">' +

        '</div>' +
        '<ol class="qg-list">' + members.map(function (m) {
          return '<li>' + esc(m) + '</li>';

    return q.last.map(function (members, i) {
      return groupName(i) + ':\n' + members.map(function (m, k) {
        return '  ' + (k + 1) + '. ' + m;

    var text = this.asText();

      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    }
  };

  global.BustanGroups = { create: function (o) { return new Groups(o); }, split: split, groupsCount: groupsCount };
})(window);

<script>
/* ==========================================================================

(function () {
  'use strict';

  var T = window.Trees, Sound = window.Sound, Store = window.Store, Exporter = window.Exporter;
  var timer = null, wheel = null, groups = null;
  var TH = window.Theme || {};
  /* كلمات الثيم: ثمرة/شجرة في البستان، نجمة/كوكب في المجرّة، كتاب/رفّ في الرفوف */
  var W = TH.words || { item: L('ثمرة'), itemAl: L('الثمرة'), holder: L('شجرة'), holderAl: L('الشجرة'), icon: '🌱',
    empty: L('البستان في انتظار أول ثمرة — اضغطي على أي شجرة!'),
    notStarted: L('أضيفي ثمرة واحدة على الأقل لإحدى المجموعات ثم أعلني الفائزة.') };
  var SVGNS = 'http://www.w3.org/2000/svg';
  var state = Store.load();

  /* ------------------------------- أدوات عامة ---------------------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function svgNode(markup) {
    var doc = new DOMParser().parseFromString('<svg xmlns="' + SVGNS + '">' + markup + '</svg>', 'image/svg+xml');
    var first = doc.documentElement.firstChild;
    return first ? document.importNode(first, true) : null;
  }

  function persist() {
    /* نعلّم التغيير أولًا ثم نحفظ، فيبقى أثره لو أُغلقت الصفحة قبل الرفع */
    if (window.Sync && window.Sync.on) window.Sync.touch();
    Store.save(state);
  }

  /* ----------------------------- حالة المزامنة --------------------------- */
  var SYNC_TEXT = {
    syncing: 'جارٍ الحفظ في حسابك…',
    saved:   'محفوظ في حسابك',
    offline: 'بلا إنترنت — سيُحفظ عند عودة الاتصال',
    error:   'تعذّر الحفظ في الحساب — النقاط محفوظة على الجهاز'
  };
  function paintSync(s) {
    var chip = $('#sync-chip');
    if (!chip) return;
    if (s === 'off' || !SYNC_TEXT[s]) { chip.hidden = true; return; }
    chip.hidden = false;
    chip.dataset.state = s;
    $('#sync-text').textContent = L(SYNC_TEXT[s]);
  }

  /* يبدأ المزامنة بعد دخول صحيح، إن كانت هذه نسخة مربوطة بحساب */
  function startSync(user, pin) {

    window.Sync.start(user, pin, state, {
      state: function () { return state; },
      status: paintSync,
      refresh: function () {
        Sound.setEnabled(state.sound);

      conflict: conflictSheet

  }

  /* اللوحة تغيّرت على جهازين معًا: القرار لها، ولا نمحو شيئًا دون إذنها */
  function conflictSheet(c) {
    var when = '';
    try {
      when = new Intl.DateTimeFormat(L.lang === 'en' ? 'en-GB' : 'ar',
        { dateStyle: 'short', timeStyle: 'short' }).format(new Date(c.when));
    } catch (e) {}
    openSheet(
      '<h2>' + Icon('load', 22) + ' ' + L('نسختان مختلفتان') + '</h2>' +
      '<p class="note">' + L('اللوحة تغيّرت على هذا الجهاز وعلى جهاز آخر معًا. أيّهما تعتمدين؟') + '</p>' +
      '<div class="sheet-actions" style="justify-content:flex-start">' +
        '<button class="btn btn--primary" id="cf-remote" type="button">' +
          L('نسخة الحساب') + ' · ' + c.remote + ' ' + L('نقطة') + (when ? ' · ' + when : '') + '</button>' +
        '<button class="btn" id="cf-local" type="button">' +
          L('نسخة هذا الجهاز') + ' · ' + c.local + ' ' + L('نقطة') + '</button>' +
      '</div>' +
      '<p class="note">' + L('ما لا تختارينه يُستبدل، فاختاري النسخة الأحدث عندك.') + '</p>',
      function (ov) {
        $('#cf-remote', ov).addEventListener('click', function () { c.useRemote(); closeSheet(); });

  }


  /* عدد المجموعات الذي اختارته المعلّمة: البقيّة تبقى محفوظة ولا تُعرض */
  function visibleCount() { return Math.max(2, Math.min(6, parseInt(state.visible, 10) || 6)); }
  function visibleGroups() { return state.groups.slice(0, visibleCount()); }

  function leaders() {
    var gs = visibleGroups(), top = 0, i;
    for (i = 0; i < gs.length; i++) if (gs[i].count > top) top = gs[i].count;

    return { top: top, list: gs.filter(function (g) { return g.count === top; }) };

  /* تنبيه صغير أسفل الشاشة، ومعه زرّ تراجع عند الحاجة */

    var old = $('.toast'); if (old) old.remove();
    if (toastTimer) clearTimeout(toastTimer);

  /* ============================ شاشة الدخول ============================== */
  function initLogin() {
    var mark = $('#login-mark');

      ? window.BustanLogo.svg({ word: false, tag: false })
      : T.standalone(T.LIST[0].id, 6);

    $('#login-hint').textContent = L('تُحفظ بيانات المسابقة في هذا الجهاز ولا تُرسل إلى أي مكان.');

    /* الدخول يعمل بالضغط وبمفتاح Enter معًا، حتى داخل الصفحات المضمّنة

    var busy = false;
    function attempt(e) {
      if (e) e.preventDefault();
      if (busy) return;

      setTimeout(function () { busy = false; }, 150);

        void card.offsetWidth;
        card.classList.add('shake');
        Sound.error();
        $('#in-pin').value = '';
        $('#in-pin').focus();
      }
    }

    $('#login-form').addEventListener('submit', attempt);
    $('#login-go').addEventListener('click', attempt);
    $$('#login-form input').forEach(function (inp) {
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(e); });
    });
  }

  function showLogin() {
    $('#board').classList.add('hidden');
    $('#login').classList.remove('hidden');
    $('#login-msg').textContent = '';
    $('#in-user').value = '';
    $('#in-pin').value = '';

  /* ============================== بناء البطاقة =========================== */
  function cardMarkup(g) {
    var t = T.byId[g.treeId];
    return '<article class="card" data-gid="' + esc(g.id) + '" style="--tone:' + t.tone + '">' +
      '<div class="card-head">' +
        '<input class="gname" type="text" maxlength="30" value="' + esc(g.name) + '" aria-label="' + L('اسم المجموعة') + '">' +
        '<span class="tree-tag">' + esc(t.name) + '</span>' +
      '</div>' +
      '<button class="tree-btn" type="button" aria-label="' + L('أضف') + ' ' + esc(t.fruit) + ' ' + L('إلى') + ' ' + esc(g.name) + '">' +
        '<span class="tree-stage">' +
          '<svg viewBox="' + T.VIEWBOX + '" aria-hidden="true">' + T.defs() +
            '<g class="tree-scale" style="transform:scale(' + T.scaleOf(g.count) + ')">' +
              T.treeSvg(g.treeId, g.count, { texture: state.texture }) +
            '</g>' +
          '</svg>' +
        '</span>' +
        '<span class="tap-hint">' + L('اضغطي لإضافة') + ' ' + esc(t.fruit) + '</span>' +
      '</button>' +
      '<div class="card-foot">' +
        '<div class="score"><svg viewBox="' + (T.CHIP_VIEWBOX || '-10 -11 20 22') + '" aria-hidden="true">' + T.fruitShape(g.treeId) + '</svg>' +
        '<span class="num">' + g.count + '</span><span class="unit">' + esc(T.unitFor(g.treeId, g.count)) + '</span></div>' +
        '<button class="btn btn--sm undo" type="button" aria-label="' + L('تراجع عن آخر') + ' ' + esc(W.item) + ' ' + L('في') + ' ' + esc(g.name) + '">↩︎ ' + L('تراجع') + '</button>' +
      '</div>' +
    '</article>';
  }

  function renderBoard() {
    $('#board-heading').textContent = state.title;
    document.title = state.title;
    var grid = $('#grid');
    grid.setAttribute('data-n', visibleCount());
    grid.innerHTML = visibleGroups().map(cardMarkup).join('');
    updateWinner();
  }

  function cardOf(gid) { return $('.card[data-gid="' + gid + '"]'); }
  function groupOf(gid) {
    for (var i = 0; i < state.groups.length; i++) if (state.groups[i].id === gid) return state.groups[i];
    return null;
  }

  /* --------------------------- إضافة ثمرة وتراجع -------------------------- */
  function refreshTree(card, g) {
    var body = $('.tree-body', card);
    body.setAttribute('data-stage', T.stageOf(g.count));
    body.setAttribute('data-fruit', g.count ? '1' : '0');
    $('.tree-scale', card).style.transform = 'scale(' + T.scaleOf(g.count) + ')';
    var num = $('.score .num', card);
    num.textContent = g.count;
    $('.score .unit', card).textContent = T.unitFor(g.treeId, g.count);
    num.classList.remove('bump');
    void num.offsetWidth;
    num.classList.add('bump');
  }

  function rebuildFruitLayer(card, g) {
    var layer = $('.fruit-layer', card);
    var size = T.fruitSize(g.count), html = '', i;
    if (T.layerMarkup) {
      html = T.layerMarkup(g.treeId, g.count);
    } else {
      for (i = 0; i < g.count; i++) html += T.fruitMarkup(g.treeId, i, size);
    }
    var holder = svgNode('<g>' + html + '</g>');
    layer.textContent = '';
    while (holder && holder.firstChild) layer.appendChild(holder.firstChild);
  }

  function addFruit(gid, silent) {
    var g = groupOf(gid); if (!g) return;
    var card = cardOf(gid); if (!card) return;
    var prevSize = T.fruitSize(g.count);
    g.count += 1;
    var size = T.fruitSize(g.count);

    if (T.layerMarkup) {
      rebuildFruitLayer(card, g);
      var fresh = $$('.fruit-layer .fruit', card).pop();
      if (fresh) {
        fresh.setAttribute('class', 'fruit pop');
        setTimeout(function () { fresh.setAttribute('class', 'fruit'); }, 560);
      }
    } else if (size !== prevSize) {
      rebuildFruitLayer(card, g);
    } else {
      var node = svgNode(T.fruitMarkup(g.treeId, g.count - 1, size));
      if (node) {
        node.setAttribute('class', 'fruit pop');
        $('.fruit-layer', card).appendChild(node);
        setTimeout(function () { node.setAttribute('class', 'fruit'); }, 560);
      }
    }
    refreshTree(card, g);

    var plus = document.createElement('span');
    plus.className = 'plusone';
    plus.textContent = '+1';
    $('.tree-stage', card).appendChild(plus);
    setTimeout(function () { plus.remove(); }, 900);

    if (!silent) Sound.pop(g.count);
    persist();
    updateWinner();
  }

  function undoFruit(gid) {
    var g = groupOf(gid); if (!g || g.count === 0) return;
    var card = cardOf(gid);
    var prevSize = T.fruitSize(g.count);
    g.count -= 1;
    if (T.layerMarkup || T.fruitSize(g.count) !== prevSize) {
      rebuildFruitLayer(card, g);
    } else {
      var layer = $('.fruit-layer', card);
      var last = layer.lastChild;
      if (last) {
        last.setAttribute('class', 'fruit vanish');
        setTimeout(function () { if (last.parentNode) last.parentNode.removeChild(last); }, 300);
      }
    }
    refreshTree(card, g);
    Sound.undo();
    persist();
    updateWinner();
  }

  function updateWinner() {
    var w = leaders();
    $$('.card').forEach(function (c) {
      var g = groupOf(c.getAttribute('data-gid'));
      c.classList.toggle('leader', !!g && w.top > 0 && g.count === w.top);
    });
    var b = $('#banner');
    if (w.top === 0) {
      b.innerHTML = '<span class="crown" aria-hidden="true">' + esc(W.icon) + '</span> ' + esc(W.empty);
    } else if (w.list.length === 1) {
      var t = T.byId[w.list[0].treeId];
      b.innerHTML = '<span class="crown" aria-hidden="true">👑</span> ' + L('المتصدّرة الآن') + ': <strong>' +
        esc(w.list[0].name) + '</strong> ' + L('بـ') + ' ' + esc(T.countLabel(w.list[0].treeId, w.top));
    } else {
      b.innerHTML = '<span class="crown" aria-hidden="true">🤝</span> ' + L('تعادل في الصدارة بـ') + ' ' + w.top + ' — ' +
        w.list.map(function (g) { return '<strong>' + esc(g.name) + '</strong>'; }).join(' ' + L('و') + ' ');
    }
  }

  /* ============================== نوافذ منبثقة ============================ */
  var lastFocus = null;

  function openSheet(html, onReady) {
    closeSheet();
    if (timer) timer.closeBig();
    if (wheel) wheel.close();
    if (groups) groups.close();
    lastFocus = document.activeElement;
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = '<div class="sheet">' + html + '</div>';
    $('#modal-root').appendChild(ov);
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) closeSheet(); });
    document.addEventListener('keydown', escClose);
    var focusable = $$('button, input, select, [tabindex]', ov);
    if (focusable.length) focusable[0].focus();
    if (onReady) onReady(ov);
    return ov;
  }

  function escClose(e) { if (e.key === 'Escape') closeSheet(); }

  function closeSheet() {
    var ov = $('#modal-root .overlay:not(.timer-overlay):not(.wheel-overlay):not(.qg-overlay)');
    if (ov) ov.remove();
    document.removeEventListener('keydown', escClose);
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
    lastFocus = null;
  }

  /* ------------------------------- الاحتفال ------------------------------- */
  function fruitRain(treeId, count) {
    var rain = document.createElement('div');
    rain.className = 'rain';
    rain.setAttribute('aria-hidden', 'true');
    var shape = T.fruitShape(treeId);
    for (var i = 0; i < (count || 40); i++) {
      var s = document.createElement('span');
      var sz = 18 + Math.random() * 20;
      s.style.insetInlineStart = (Math.random() * 100) + '%';
      s.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
      s.style.animationDelay = (Math.random() * 1.6) + 's';
      s.innerHTML = '<svg width="' + sz + '" height="' + sz + '" viewBox="-10 -11 20 22">' + shape + '</svg>';
      rain.appendChild(s);
    }
    document.body.appendChild(rain);
    setTimeout(function () { rain.remove(); }, 6500);
  }

  window.BustanRain = function (count) {
    var w = leaders();
    var id = w.list.length ? w.list[0].treeId : state.groups[0].treeId;
    fruitRain(id, count || 32);
  };

  function celebrate() {
    var w = leaders();

      openSheet('<h2>' + esc(W.icon) + ' ' + L('لم تبدأ المسابقة بعد') + '</h2><p class="note">' + esc(W.notStarted) + '</p>' +

      ? '<p class="win-tie">' + L('تشاركت في الصدارة') + ': ' + w.list.map(function (g) { return esc(g.name); }).join(' ' + L('و') + ' ') + '</p>'
      : '';

      '<h2 style="justify-content:center">' + head + '</h2>' +

      '<p class="win-count">' + esc(T.countLabel(first.treeId, first.count)) + ' ' + L('على') + ' ' + esc(t.name) + '</p>' +

  /* --------------------------- نقطة لكل المجموعات ------------------------- */
  function addAll() {
    var gs = visibleGroups();
    Sound.unlock();
    gs.forEach(function (g, i) {
      setTimeout(function () { addFruit(g.id, true); }, i * 80);
    });
    Sound.sparkle();
    toast(L('أُضيفت نقطة لكل المجموعات'), L('تراجع'), function () {
      gs.forEach(function (g) { undoFruit(g.id); });

  /* ---------------------------- وضع العرض الكامل -------------------------- */
  function setPresent(on) {
    var r = document.documentElement;
    r.classList.toggle('present', on);
    var ex = $('#present-exit'); if (ex) ex.hidden = !on;
    try {
      if (on && r.requestFullscreen) r.requestFullscreen();
      else if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    } catch (e) {}
  }
  function presentOn() { return document.documentElement.classList.contains('present'); }

  /* --------------------------- نسخة احتياطية واستعادة --------------------- */
  function backupName() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (TH.id || 'bustan') + '-backup-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.json';
  }

  function doBackup() {
    var copy = JSON.parse(JSON.stringify(state));
    copy.loggedIn = false;
    delete copy.sync;
    copy.theme = TH.id || 'garden';
    copy.savedAt = new Date().toISOString();
    var blob = new Blob([JSON.stringify(copy, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function restoreFrom(text, ov) {
    var data;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    var msg = $('#bk-msg', ov);
    if (!data || typeof data !== 'object' || !Array.isArray(data.groups) || !data.groups.length) {
      msg.textContent = L('هذا الملف ليس نسخة احتياطية صالحة لهذه اللوحة.');
      msg.className = 'login-msg show';
      return;
    }
    var other = data.theme && TH.id && data.theme !== TH.id;
    var total = data.groups.reduce(function (a, g) { return a + (parseInt(g.count, 10) || 0); }, 0);
    msg.innerHTML = '';
    msg.className = 'note';
    msg.textContent = L('الملف يحمل') + ' ' + data.groups.length + ' ' + L('مجموعات، ومجموع نقاطها') + ' ' + total + '.' +
      (other ? ' ' + L('تنبيه: النسخة من لوحة أخرى، وستُستبدل أسماء') + ' ' + W.holderAl + ' ' + L('بما يناسب هذه اللوحة.') : '');
    var go = $('#bk-apply', ov);
    go.hidden = false;
    go.onclick = function () {
      data.loggedIn = true;
      /* المستعاد يصير هو الأحدث، فيُرفع للحساب بعد إعادة التحميل */
      data.sync = { rev: (state.sync && state.sync.rev) || 0, at: null, dirty: true };
      try { localStorage.setItem(Store.KEY, JSON.stringify(data)); } catch (e) {}
      location.reload();
    };
  }

  function backupSheet() {
    openSheet(
      '<h2>' + Icon('save', 22) + ' ' + L('نسخة احتياطية') + '</h2>' +
      '<p class="note">' + (window.Sync && window.Sync.on
        ? L('النقاط محفوظة في حسابك وتتبعك على أي جهاز. أسماء الطالبات تبقى في هذا المتصفّح وحده، والنسخة الاحتياطية تحفظها كذلك.')
        : L('النقاط والأسماء محفوظة في هذا المتصفّح وحده. احفظي نسخة بين حين وآخر،') + ' ' +
          L('فتعود اللوحة كما هي على أي جهاز.')) + '</p>' +
      '<div class="sheet-actions" style="justify-content:flex-start">' +
        '<button class="btn btn--primary" id="bk-save" type="button">' + Icon('save', 17) + ' ' + L('حفظ نسخة الآن') + '</button>' +
        '<button class="btn" id="bk-pick" type="button">' + Icon('load', 17) + ' ' + L('استعادة من ملف') + '</button>' +
      '</div>' +
      '<input type="file" id="bk-file" accept=".json,application/json" hidden>' +
      '<p id="bk-msg" class="note"></p>' +
      '<div class="sheet-actions">' +
        '<button class="btn" data-close type="button">' + L('إغلاق') + '</button>' +
        '<button class="btn btn--danger" id="bk-apply" type="button" hidden>' + L('استبدال بيانات اللوحة الآن') + '</button>' +
      '</div>',
      function (ov) {
        $('#bk-save', ov).addEventListener('click', function () {
          doBackup();
          $('#bk-msg', ov).textContent = L('حُفظ الملف في مجلّد التنزيلات. احتفظي به في مكان تجدينه.');
        });
        $('#bk-pick', ov).addEventListener('click', function () { $('#bk-file', ov).click(); });
        $('#bk-file', ov).addEventListener('change', function () {
          var f = this.files && this.files[0];
          if (!f) return;
          var fr = new FileReader();
          fr.onload = function () { restoreFrom(String(fr.result), ov); };
          fr.readAsText(f);
        });
      }
    );
  }

  /* ------------------------------ إعادة المسابقة -------------------------- */
  function snapshot() {
    return {
      date: new Date().toISOString(),
      title: state.title,
      results: visibleGroups().map(function (g) { return { name: g.name, treeId: g.treeId, count: g.count }; })
    };
  }

  function confirmReset() {
    var total = visibleGroups().reduce(function (s, g) { return s + g.count; }, 0);
    openSheet(
      '<h2>🔄 ' + L('إعادة المسابقة') + '</h2>' +
      '<p class="note">' + L('سيعود عدّاد كل مجموعة إلى صفر وتبدأ الأشجار من جديد.') +
      (total > 0 ? ' ' + L('تُحفظ النتيجة الحالية في السجل قبل المسح.') : '') + '</p>' +
      '<label class="switch"><input type="checkbox" id="keep-names" checked> ' + L('الاحتفاظ بأسماء المجموعات') + '</label>' +
      (total > 0 ? '<label class="switch"><input type="checkbox" id="archive" checked> ' + L('حفظ النتيجة الحالية في السجل') + '</label>' : '') +
      '<div class="sheet-actions">' +
        '<button class="btn" data-close type="button">' + L('إلغاء') + '</button>' +
        '<button class="btn btn--danger" id="do-reset" type="button">' + L('نعم، ابدئي من جديد') + '</button>' +
      '</div>',
      function (ov) {
        $('#do-reset', ov).addEventListener('click', function () {
          var arch = $('#archive', ov);
          if (arch && arch.checked && total > 0) state.history.unshift(snapshot());
          if (state.history.length > 60) state.history.length = 60;
          var keep = $('#keep-names', ov).checked;
          state.groups.forEach(function (g, i) {
            g.count = 0;
            if (!keep) g.name = L('المجموعة') + ' ' + (Store.ORD[i] || (i + 1));
          });
          persist();
          closeSheet();
          renderBoard();
          Sound.sparkle();
        });
      }
    );

  /* --------------------------------- السجل -------------------------------- */
  function historySheet() {
    var cur = snapshot();
    var curTotal = cur.results.reduce(function (s, r) { return s + r.count; }, 0);
    var html = '<h2>📜 ' + L('سجل المسابقات') + '</h2><p class="note">' + L('النتيجة الحالية والنتائج المحفوظة سابقًا.') + '</p>';

    html += '<div class="hist-item"><h3>' + L('النتيجة الحالية') + '</h3><div class="meta">' + esc(Exporter.arabicDate(cur.date)) + '</div>' +
      histList(cur) +
      '<div class="sheet-actions" style="justify-content:flex-start;margin-top:4px">' +
      '<button class="btn btn--sm" data-png="now" type="button">🖼️ ' + L('صورة') + '</button>' +
      '<button class="btn btn--sm" data-csv="now" type="button">📄 ' + L('جدول') + '</button></div></div>';

    if (!state.history.length) {
      html += '<p class="empty">' + L('لا توجد مسابقات محفوظة بعد. تُحفظ النتيجة تلقائيًا عند الضغط على «إعادة المسابقة».') + '</p>';
    } else {
      state.history.forEach(function (rec, i) {
        html += '<div class="hist-item"><h3>' + esc(rec.title || L('مسابقة')) + '</h3>' +
          '<div class="meta">' + esc(Exporter.arabicDate(rec.date)) + '</div>' + histList(rec) +
          '<div class="sheet-actions" style="justify-content:flex-start;margin-top:4px">' +
          '<button class="btn btn--sm" data-png="' + i + '" type="button">🖼️ ' + L('صورة') + '</button>' +
          '<button class="btn btn--sm" data-csv="' + i + '" type="button">📄 ' + L('جدول') + '</button>' +
          '<button class="btn btn--sm btn--danger" data-del="' + i + '" type="button">' + L('حذف') + '</button></div></div>';
      });
    }
    html += '<div class="sheet-actions"><button class="btn" data-close type="button">' + L('إغلاق') + '</button></div>';

    openSheet(html, function (ov) {
      if (curTotal === 0) $$('[data-png="now"],[data-csv="now"]', ov).forEach(function (b) { b.disabled = true; b.style.opacity = '.5'; });
      $$('[data-png]', ov).forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-png');
          Exporter.toPng(k === 'now' ? cur : state.history[+k]);
        });
      });
      $$('[data-csv]', ov).forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-csv');
          Exporter.toCsv(k === 'now' ? cur : state.history[+k]);
        });
      });
      $$('[data-del]', ov).forEach(function (b) {
        b.addEventListener('click', function () {
          state.history.splice(+b.getAttribute('data-del'), 1);
          persist();
          historySheet();
        });
      });
    });
  }

  function histList(rec) {
    var sorted = rec.results.slice().sort(function (a, b) { return b.count - a.count; });
    var top = sorted.length ? sorted[0].count : 0;
    return '<ul class="hist-list">' + sorted.map(function (r) {
      var t = T.byId[r.treeId];
      var win = top > 0 && r.count === top;
      return '<li class="' + (win ? 'win' : '') + '"><span>' + (win ? '👑 ' : '') + esc(r.name) +
        ' <small style="color:#9BA886">' + esc(t ? t.name : '') + '</small></span><span>' + r.count + '</span></li>';
    }).join('') + '</ul>';
  }

        '<select data-gtree="' + i + '" aria-label="' + esc(W.holder) + ' ' + L('المجموعة') + ' ' + (i + 1) + '">' + treeOptions(g.treeId) + '</select>' +
      '</div>';
    }).join('');

    openSheet(
      '<h2>⚙️ ' + L('الإعدادات') + '</h2><p class="note">' + L('كل التغييرات تُحفظ في هذا الجهاز.') + '</p>' +
      '<fieldset class="block"><legend>' + L('المسابقة') + '</legend>' +
        '<div class="row"><label for="set-title">' + L('عنوان اللوحة') + '</label><input type="text" id="set-title" maxlength="40" value="' + esc(state.title) + '"></div>' +
      '</fieldset>' +
      '<fieldset class="block"><legend>' + L('عدد المجموعات') + '</legend>' +
        '<p class="note" style="margin:0 0 8px">' + L('تبقى بيانات المجموعات المخفيّة محفوظة، وتعود متى زدتِ العدد.') + '</p>' +
        '<div class="seg" id="set-count">' +
          [4, 5, 6].map(function (n) {
            return '<button type="button" data-n="' + n + '" aria-pressed="' +
              (visibleCount() === n ? 'true' : 'false') + '">' + n + '</button>';
          }).join('') +
        '</div>' +
      '</fieldset>' +
      '<fieldset class="block"><legend>' + L('المجموعات و') + esc(W.holderAl) + '</legend>' + groupsHtml + '</fieldset>' +
      '<fieldset class="block"><legend>' + L('أسماء عجلة الحظ') + '</legend>' +
        '<p class="note" style="margin:0 0 8px">' + L('اسم في كل سطر. تُستخدم في عجلة الحظ وفي المجموعات السريعة.') + '</p>' +
        '<textarea id="set-names" class="names-box" rows="7" aria-label="' + L('أسماء الطلاب') + '" ' +
          'placeholder="' + L('أحمد') + '&#10;' + L('مريم') + '&#10;' + L('سالم') + '">' + esc(state.wheel.list.join('\n')) + '</textarea>' +
        (Store.STUDENTS.length
          ? '<button class="btn btn--sm" id="set-names-restore" type="button">↺ ' + L('استعادة القائمة الأصلية') + '</button>'
          : '') +
      '</fieldset>' +
      '<fieldset class="block"><legend>' + L('المظهر والصوت') + '</legend>' +
        '<label class="switch"><input type="checkbox" id="set-sound"' + (state.sound ? ' checked' : '') + '> ' + L('الأصوات اللطيفة') + '</label>' +
        '<label class="switch"><input type="checkbox" id="set-texture"' + (state.texture ? ' checked' : '') + '> ' + L('ملمس الورق الخفيف في الخلفية') + '</label>' +
      '</fieldset>' +
      '<fieldset class="block"><legend>' + L('بيانات الدخول') + '</legend>' +
        '<div class="row"><label for="set-user">' + L('اسم المستخدم') + '</label><input type="text" id="set-user" value="' + esc(state.auth.user) + '" spellcheck="false"></div>' +
        '<div class="row"><label for="set-pin">' + L('رمز الدخول') + '</label><input type="text" id="set-pin" value="' + esc(state.auth.pin) + '" spellcheck="false"></div>' +
      '</fieldset>' +
      '<div class="sheet-actions">' +
        '<button class="btn" data-close type="button">' + L('إلغاء') + '</button>' +
        '<button class="btn btn--primary" id="set-save" type="button">' + L('حفظ التغييرات') + '</button>' +
      '</div>',
      function (ov) {
        var pickCount = visibleCount();
        $$('#set-count button', ov).forEach(function (b) {
          b.addEventListener('click', function () {
            pickCount = +b.getAttribute('data-n');
            $$('#set-count button', ov).forEach(function (x) {
              x.setAttribute('aria-pressed', +x.getAttribute('data-n') === pickCount ? 'true' : 'false');
            });
          });
        });
        var restore = $('#set-names-restore', ov);
        if (restore) restore.addEventListener('click', function () {
          $('#set-names', ov).value = Store.STUDENTS.join('\n');
        });
        $('#set-save', ov).addEventListener('click', function () {
          var title = $('#set-title', ov).value.trim();
          if (title) state.title = title;
          state.visible = pickCount;
          $$('[data-gname]', ov).forEach(function (inp) {
            var i = +inp.getAttribute('data-gname');
            var v = inp.value.trim();
            if (v) state.groups[i].name = v;
          });
          $$('[data-gtree]', ov).forEach(function (sel) {
            var i = +sel.getAttribute('data-gtree');
            if (T.byId[sel.value]) state.groups[i].treeId = sel.value;
          });
          var names = $('#set-names', ov).value.split('\n')
            .map(function (x) { return x.trim(); })
            .filter(Boolean).slice(0, 120);
          var changed = state.wheel.list.join('\n') !== names.join('\n');
          state.wheel.list = names;
          state.wheel.picked = state.wheel.picked.filter(function (x) { return names.indexOf(x) !== -1; });
          if (changed && state.wheel.quick) state.wheel.quick.last = null;
          state.sound = $('#set-sound', ov).checked;
          state.texture = $('#set-texture', ov).checked;
          var u = $('#set-user', ov).value.trim();
          var pin = $('#set-pin', ov).value.trim();
          if (u) state.auth.user = u;
          if (pin) state.auth.pin = pin;
          Sound.setEnabled(state.sound);
          document.body.classList.toggle('no-texture', !state.texture);
          persist();
          closeSheet();
          renderBoard();
          Sound.sparkle();
        });
      }
    );
  }

  /* ============================== ربط الأحداث ============================= */
  function toggleMenu(open) {
    var m = $('#more-menu'), b = $('#btn-more');
    if (!m || !b) return;
    m.hidden = !open;
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  /* كل زرّ في القائمة يغلقها قبل أن يفتح نافذته */
  function on(sel, fn) {
    var el = $(sel); if (!el) return;
    el.addEventListener('click', function () { toggleMenu(false); fn(); });
  }

  function bindBoard() {
    $('#grid').addEventListener('click', function (e) {
      var tree = e.target.closest('.tree-btn');
      if (tree) { addFruit(tree.closest('.card').getAttribute('data-gid')); return; }
      var undo = e.target.closest('.undo');
      if (undo) { undoFruit(undo.closest('.card').getAttribute('data-gid')); }
    });

    $('#grid').addEventListener('change', function (e) {
      if (!e.target.classList.contains('gname')) return;
      var card = e.target.closest('.card');
      var g = groupOf(card.getAttribute('data-gid'));
      var v = e.target.value.trim();
      if (!v) { e.target.value = g.name; return; }
      g.name = v;
      var t = T.byId[g.treeId];
      $('.tree-btn', card).setAttribute('aria-label', L('أضف') + ' ' + t.fruit + ' ' + L('إلى') + ' ' + v);
      persist();
      updateWinner();
    });

    on('#btn-celebrate', celebrate);
    on('#btn-wheel', function () { if (wheel) wheel.open(); });
    on('#btn-groups', function () { if (groups) groups.open(); });
    on('#btn-all', addAll);
    on('#btn-present', function () { setPresent(!presentOn()); });
    on('#btn-history', historySheet);
    on('#btn-backup', backupSheet);
    on('#btn-settings', settingsSheet);
    on('#btn-reset', confirmReset);
    on('#btn-logout', function () {
      if (window.Sync && window.Sync.on) { window.Sync.flush(); window.Sync.stop(); }
      paintSync('off');
      state.loggedIn = false; Store.save(state); showLogin();
    });
    $('#present-exit').addEventListener('click', function () { setPresent(false); });

    /* قائمة «المزيد» */
    $('#btn-more').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu($('#more-menu').hidden);
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.menu-wrap')) toggleMenu(false);
    });
    document.addEventListener('fullscreenchange', function () {
      if (!document.fullscreenElement && presentOn()) {
        document.documentElement.classList.remove('present');
        $('#present-exit').hidden = true;
      }
    });

    $('#modal-root').addEventListener('click', function (e) {
      if (e.target.closest('.timer-overlay') || e.target.closest('.wheel-overlay') || e.target.closest('.qg-overlay')) return;
      if (e.target.closest('[data-close]')) closeSheet();
    });

    /* مفاتيح الأرقام ١-٦ لإضافة ثمرة بسرعة */
    document.addEventListener('keydown', function (e) {
      if ($('#board').classList.contains('hidden')) return;
      if ($('#modal-root .overlay')) return;
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      var map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5,
                  '١': 0, '٢': 1, '٣': 2, '٤': 3, '٥': 4, '٦': 5 };
      if (e.key === 'Escape' && presentOn()) { e.preventDefault(); setPresent(false); return; }
      if (map[e.key] != null && map[e.key] < visibleCount() && state.groups[map[e.key]]) {
        e.preventDefault();
        Sound.unlock();
        addFruit(state.groups[map[e.key]].id);
      }
    });
  }

  function showBoard() {
    $('#login').classList.add('hidden');
    $('#board').classList.remove('hidden');
    renderBoard();
    if (!timer) {
      timer = window.BustanTimer.create({
        mount: $('#timer'),
        get: function () { return state.timer; },
        save: persist,
        beforeOpen: closeSheet
      });
    }
    if (!wheel) {
      wheel = window.BustanWheel.create({
        get: function () { return state.wheel; },
        save: persist,
        beforeOpen: function () { closeSheet(); if (timer) timer.closeBig(); if (groups) groups.close(); },
        openSettings: settingsSheet
      });
    }
    if (!groups) {
      groups = window.BustanGroups.create({
        get: function () { return state.wheel; },
        save: persist,
        beforeOpen: function () { closeSheet(); if (timer) timer.closeBig(); if (wheel) wheel.close(); },
        openSettings: settingsSheet
      });
    }
  }

  /* ================================= الإقلاع ============================== */
  /* أيقونات الشريط والقائمة */
  function paintIcons() {
    var I = window.Icon || function () { return ''; };
    [['#btn-celebrate', 'cup'], ['#btn-wheel', 'wheel'], ['#btn-groups', 'users'], ['#btn-all', 'plus'],
     ['#btn-present', 'full'], ['#btn-more', 'more'], ['#btn-history', 'list'], ['#btn-backup', 'save'],
     ['#btn-settings', 'gear'], ['#btn-reset', 'reset'], ['#btn-logout', 'exit']
    ].forEach(function (m) {
      var el = $(m[0]);
      if (el && !$('.ic', el)) el.insertAdjacentHTML('afterbegin', I(m[1], 17));
    });
    var ex = $('#present-exit');
    if (ex && !$('.ic', ex)) {
      ex.innerHTML = I('small', 15) + ' ' + L('خروج من وضع العرض');
    }
  }

  function applyTheme() {
    var r = document.documentElement;
    r.setAttribute('data-theme', TH.id || 'garden');
    r.setAttribute('dir', TH.dir || 'rtl');
    r.setAttribute('lang', TH.lang || 'ar');
    if (window.L && window.L.translateStatic) window.L.translateStatic(document.body);
    if (TH.title) {
      var lt = $('#login-title'); if (lt) lt.textContent = TH.title;
    }
    if (TH.tagline) {
      var sub = $('.login-card .sub'); if (sub) sub.textContent = TH.tagline;
    }
    var ic = $('#board-title span[aria-hidden]');
    if (ic && window.BustanLogo) ic.innerHTML = window.BustanLogo.svg({ word: false, tag: false });
    else if (ic && TH.icon) ic.textContent = TH.icon;
    if (TH.boardHint) {
      var fn = $('.foot-note'); if (fn) fn.textContent = TH.boardHint;
    }
  }

  function init() {
    applyTheme();
    paintIcons();
    /* يثبّت أي ترقية جرت أثناء التحميل، مثل تغيير الرمز الافتراضي */
    persist();
    Sound.setEnabled(state.sound);
    document.body.classList.toggle('no-texture', !state.texture);
    initLogin();
    bindBoard();
    if (state.loggedIn) {
      showBoard();
      startSync(state.auth.user, state.auth.pin);
    } else showLogin();
    if (window.BustanLogo) window.BustanLogo.splash();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
